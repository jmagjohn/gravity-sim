<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gravity</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #03000a; 
      overflow: hidden; 
      width: 100vw; 
      height: 100vh;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    canvas { position: fixed; inset: 0; touch-action: none; }

    #ui {
      position: fixed; inset: 0; pointer-events: none; z-index: 10;
      font-family: 'Space Mono', monospace;
    }

    #hint {
      position: absolute;
      bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      left: 50%; transform: translateX(-50%);
      font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
      color: rgba(168, 85, 247, 0.35);
      white-space: nowrap;
      transition: opacity 1s;
    }

    #clear-btn {
      position: absolute;
      top: calc(24px + env(safe-area-inset-top, 0px));
      right: calc(24px + env(safe-area-inset-right, 0px));
      pointer-events: all;
      font-family: 'Space Mono', monospace;
      font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: #fff;
      background: #7c3aed;
      border: none;
      border-radius: 8px; padding: 12px 24px;
      cursor: pointer;
      box-shadow: 0 4px 14px 0 rgba(124, 58, 237, 0.5);
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    #clear-btn:hover {
      background: #8b5cf6;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
    }
    #clear-btn:active {
      transform: translateY(1px);
    }

    #charge-ring {
      position: absolute; pointer-events: none;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.5);
      transform: translate(-50%, -50%);
      display: none;
      box-shadow: 0 0 12px rgba(168,85,247,0.4);
    }
    #velocity-line {
      position: absolute; pointer-events: none;
      height: 2px;
      background: rgba(168, 85, 247, 0.6);
      transform-origin: left center;
      display: none;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button id="clear-btn" onclick="resetSim()">reset</button>
  <div id="hint">hold and drag to launch mass</div>
  <div id="charge-ring"></div>
  <div id="velocity-line"></div>
</div>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const G          = 1;
const DT         = 1;
const MAX_BODIES = 40;
const GRID_STEP  = 20;       // much finer grid for smoothness
const MAX_WARP   = 100;      // cap slightly lower to prevent "jaggies"
const WARP_STR   = 35000;    // strength balanced for finer resolution
const SOFTENING  = 600;      // lower softening for more localized curves
const TRAIL      = 0.18;
const MAX_CHARGE = 2800;
const MASS_MIN   = 15;
const MASS_MAX   = 1200;

// ─── Perspective params ───────────────────────────────────────────────────────
// World coords: (0,0) = center. Y negative = top/far, positive = bottom/near.
// Squishing Y and widening X at the bottom gives an angled-view illusion.
const Y_SQUISH = 0.44;   // vertical compression
const X_PERSP  = 0.22;   // x spreads wider toward viewer (bottom)

function toScreen(wx, wy) {
  const yFrac  = wy / Math.max(H * 0.5, 1);
  const xScale = 1 + yFrac * X_PERSP;
  return {
    x: W * 0.5 + wx * xScale,
    y: H * 0.52 + wy * Y_SQUISH,
    s: Math.max(0.55, xScale),
  };
}

function fromScreen(sx, sy) {
  const wy     = (sy - H * 0.52) / Y_SQUISH;
  const yFrac  = wy / Math.max(H * 0.5, 1);
  const xScale = Math.max(0.1, 1 + yFrac * X_PERSP);
  return { x: (sx - W * 0.5) / xScale, y: wy };
}

// ─── Setup ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ─── Body class (world coordinates) ──────────────────────────────────────────
class Body {
  constructor(x, y, mass, vx = 0, vy = 0) {
    this.x = x; this.y = y;
    this.mass = mass;
    this.vx = vx; this.vy = vy;
    this.radius = massToRadius(mass);
    this.dead = false;
  }
}

function massToRadius(m) { return Math.cbrt(m) * 2.6; }

function massToColor(m) {
  if (m < 40)  return [160, 200, 255];
  if (m < 120) return [230, 240, 255];
  if (m < 300) return [255, 210, 80];
  if (m < 600) return [255, 140, 40];
  if (m < 900) return [220, 60,  40];
  return              [180, 80,  255];
}

// ─── Simulation state ─────────────────────────────────────────────────────────
let bodies = [];

function spawnOrbiter(cx, cy, centralMass, orbitR, bodyMass, direction = 1) {
  const vOrbit = Math.sqrt(G * centralMass / orbitR) * direction;
  const angle  = Math.random() * Math.PI * 2;
  return new Body(
    cx + Math.cos(angle) * orbitR,
    cy + Math.sin(angle) * orbitR,
    bodyMass,
    -Math.sin(angle) * vOrbit,
     Math.cos(angle) * vOrbit
  );
}

function resetSim() {
  bodies = [];
  // Scale orbits to screen size so they're always visible
  const R = Math.min(W, H) * 0.36;
  bodies.push(new Body(0, 0, 700, 0, 0));
  bodies.push(spawnOrbiter(0, 0, 700, R * 0.44, 25,  1));
  bodies.push(spawnOrbiter(0, 0, 700, R * 0.66, 50, -1));
  bodies.push(spawnOrbiter(0, 0, 700, R * 0.90, 18,  1));
}
resetSim();

// ─── Physics (world space) ────────────────────────────────────────────────────
function stepPhysics() {
  const n = bodies.length;
  const ax = new Float64Array(n);
  const ay = new Float64Array(n);

  for (let i = 0; i < n; i++) {
    if (bodies[i].dead) continue;
    for (let j = i + 1; j < n; j++) {
      if (bodies[j].dead) continue;
      const dx   = bodies[j].x - bodies[i].x;
      const dy   = bodies[j].y - bodies[i].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const rSum = bodies[i].radius + bodies[j].radius;

      if (dist < rSum * 0.85) {
        const tm = bodies[i].mass + bodies[j].mass;
        bodies[i].x  = (bodies[i].x  * bodies[i].mass + bodies[j].x  * bodies[j].mass) / tm;
        bodies[i].y  = (bodies[i].y  * bodies[i].mass + bodies[j].y  * bodies[j].mass) / tm;
        bodies[i].vx = (bodies[i].vx * bodies[i].mass + bodies[j].vx * bodies[j].mass) / tm;
        bodies[i].vy = (bodies[i].vy * bodies[i].mass + bodies[j].vy * bodies[j].mass) / tm;
        bodies[i].mass   = tm;
        bodies[i].radius = massToRadius(tm);
        bodies[j].dead   = true;
        continue;
      }

      const f  = G * bodies[i].mass * bodies[j].mass / (dist * dist + SOFTENING);
      const fx = f * dx / dist;
      const fy = f * dy / dist;
      ax[i] += fx / bodies[i].mass;
      ay[i] += fy / bodies[i].mass;
      ax[j] -= fx / bodies[j].mass;
      ay[j] -= fy / bodies[j].mass;
    }
  }

  for (let i = 0; i < n; i++) {
    if (bodies[i].dead) continue;
    bodies[i].vx += ax[i] * DT;
    bodies[i].vy += ay[i] * DT;
    bodies[i].x  += bodies[i].vx * DT;
    bodies[i].y  += bodies[i].vy * DT;
  }

  bodies = bodies.filter(b => !b.dead);
}

// ─── Grid warp (world space, then project to screen) ─────────────────────────
function drawGrid() {
  const gW   = W  * 1.2;
  const gH   = H  * 1.2;
  const cols = Math.ceil(gW * 2 / GRID_STEP) + 2;
  const rows = Math.ceil(gH * 2 / GRID_STEP) + 2;

  const pts = [];
  for (let r = 0; r <= rows; r++) {
    pts[r] = [];
    for (let co = 0; co <= cols; co++) {
      const gwx = -gW - GRID_STEP + co * GRID_STEP;
      const gwy = -gH - GRID_STEP + r  * GRID_STEP;
      let dx = 0, dy = 0;

      for (const b of bodies) {
        const ex  = b.x - gwx, ey  = b.y - gwy;
        const d2  = ex * ex + ey * ey + 1000; // higher softening specifically for grid points
        const str = Math.min(MAX_WARP, b.mass * WARP_STR / (d2 * Math.sqrt(d2)));
        dx += ex * str;
        dy += ey * str;
      }

      const dLen = Math.sqrt(dx*dx + dy*dy);
      if (dLen > MAX_WARP) { dx = dx/dLen*MAX_WARP; dy = dy/dLen*MAX_WARP; }

      const p = toScreen(gwx + dx, gwy + dy);
      pts[r][co] = p;
    }
  }

  ctx.strokeStyle = 'rgba(168, 85, 247, 0.25)';
  ctx.lineWidth = 1.0;
  ctx.beginPath();

  for (let r = 0; r <= rows; r++) {
    ctx.moveTo(pts[r][0].x, pts[r][0].y);
    for (let co = 1; co <= cols; co++) ctx.lineTo(pts[r][co].x, pts[r][co].y);
  }
  for (let co = 0; co <= cols; co++) {
    ctx.moveTo(pts[0][co].x, pts[0][co].y);
    for (let r = 1; r <= rows; r++) ctx.lineTo(pts[r][co].x, pts[r][co].y);
  }
  ctx.stroke();
}

// ─── Render bodies ────────────────────────────────────────────────────────────
function drawBodies() {
  for (const b of bodies) {
    const [r, g, bl] = massToColor(b.mass);
    const { x: sx, y: sy, s: ds } = toScreen(b.x, b.y);
    const radius = b.radius * ds;

    // Solid core only - no glow
    ctx.beginPath();
    ctx.arc(sx, sy, radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgb(${r},${g},${bl})`;
    ctx.fill();
    
    // Tiny highlight for depth
    ctx.beginPath();
    ctx.arc(sx - radius*0.2, sy - radius*0.2, radius * 0.2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fill();
  }
}

// ─── Main loop ────────────────────────────────────────────────────────────────
function frame() {
  requestAnimationFrame(frame);
  ctx.fillStyle = `rgba(3, 0, 10, ${TRAIL})`;
  ctx.fillRect(0, 0, W, H);
  stepPhysics();
  drawGrid();
  drawBodies();
  drawChargePreview();
}

// ─── Input ────────────────────────────────────────────────────────────────────
const ring  = document.getElementById('charge-ring');
const line  = document.getElementById('velocity-line');
const hint  = document.getElementById('hint');
let charging    = false;
let chargeStart = 0;
let startWX = 0, startWY = 0;    // world coords for body placement
let startSX = 0, startSY = 0;    // screen coords for body placement
let currentSX = 0, currentSY = 0; // current screen coords for velocity
let hintTimer = null;

function fadeHint() {
  clearTimeout(hintTimer);
  hint.style.opacity = '1';
  hintTimer = setTimeout(() => hint.style.opacity = '0', 3000);
}
fadeHint();

function startCharge(sx, sy) {
  charging    = true;
  chargeStart = performance.now();
  const w = fromScreen(sx, sy);
  startWX = w.x; startWY = w.y;
  startSX = sx;  startSY = sy;
  currentSX = sx; currentSY = sy;
  
  ring.style.display = 'block';
  ring.style.left = sx + 'px';
  ring.style.top  = sy + 'px';
  
  line.style.display = 'block';
  line.style.left = sx + 'px';
  line.style.top  = sy + 'px';
}

function moveCharge(sx, sy) {
  if (!charging) return;
  currentSX = sx;
  currentSY = sy;
}

function releaseCharge() {
  if (!charging) return;
  charging = false;
  ring.style.display = 'none';
  line.style.display = 'none';

  const held = Math.min(performance.now() - chargeStart, MAX_CHARGE);
  const mass = MASS_MIN + (held / MAX_CHARGE) * (MASS_MAX - MASS_MIN);

  // Velocity is proportional to the drag distance on screen
  // Dragging "away" now launches in that same direction
  const dx = (currentSX - startSX);
  const dy = (currentSY - startSY);
  
  // Convert screen drag to world velocity
  // Dialed back velocity by 10x (0.08 -> 0.008)
  const spawnProj = toScreen(startWX, startWY);
  const vScale = 0.008 / spawnProj.s; 
  
  bodies.push(new Body(startWX, startWY, mass, dx * vScale, dy * vScale / Y_SQUISH));
  fadeHint();
}

function drawChargePreview() {
  if (!charging) return;
  const held   = Math.min(performance.now() - chargeStart, MAX_CHARGE);
  const frac   = held / MAX_CHARGE;
  const mass   = MASS_MIN + frac * (MASS_MAX - MASS_MIN);
  const radius = massToRadius(mass);
  const [r, g, b] = massToColor(mass);

  const sz = radius * 2 + 12;
  ring.style.width       = sz + 'px';
  ring.style.height      = sz + 'px';
  ring.style.borderColor = `rgba(${r},${g},${b},0.7)`;
  ring.style.boxShadow   = `0 0 ${8 + frac * 20}px rgba(${r},${g},${b},0.4)`;
  
  // Update velocity line
  const dx = currentSX - startSX;
  const dy = currentSY - startSY;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const angle = Math.atan2(dy, dx);
  
  line.style.width = dist + 'px';
  line.style.transform = `rotate(${angle}rad)`;
  line.style.background = `rgba(${r},${g},${b},0.6)`;
}

// Unified pointer input
let _pointerDown = false;

window.addEventListener('pointerdown', e => {
  if (e.target === canvas) {
    e.preventDefault();
    _pointerDown = true;
    startCharge(e.clientX, e.clientY);
  }
}, { passive: false });

window.addEventListener('pointermove', e => {
  if (_pointerDown) moveCharge(e.clientX, e.clientY);
});

window.addEventListener('pointerup', e => {
  if (_pointerDown) {
    _pointerDown = false;
    releaseCharge();
  }
});

window.addEventListener('pointercancel', e => {
  if (_pointerDown) {
    _pointerDown = false;
    releaseCharge();
  }
});

// Start the simulation loop AFTER everything is initialized
frame();
</script>
</body>
</html>
